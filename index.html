<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contador</title>
    <style>
      :root {
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #1f2933;
        background: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #ffffff;
        padding: 32px 40px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(31, 41, 51, 0.15);
        text-align: center;
        display: grid;
        gap: 20px;
        min-width: 280px;
      }

      .counter {
        font-size: 64px;
        font-weight: 700;
        margin: 0;
      }

      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .increment {
        background: #12b886;
        color: #ffffff;
        box-shadow: 0 6px 16px rgba(18, 184, 134, 0.3);
      }

      .decrement {
        background: #ff6b6b;
        color: #ffffff;
        box-shadow: 0 6px 16px rgba(255, 107, 107, 0.3);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Contador</h1>
      <p class="counter" id="counter">0</p>
      <div class="buttons">
        <button class="decrement" id="decrement" type="button">Restar</button>
        <button class="increment" id="increment" type="button">Sumar</button>
      </div>
    </main>

    <script>
      const counter = document.getElementById("counter");
      const increment = document.getElementById("increment");
      const decrement = document.getElementById("decrement");
      let value = 0;

      const updateCounter = () => {
        counter.textContent = value;
      };

      increment.addEventListener("click", () => {
        value += 1;
        updateCounter();
      });

      decrement.addEventListener("click", () => {
        value -= 1;
        updateCounter();
      });
    </script>
  </body>
</html>
